# Builds SoundGen on every push. When VERSION holds a version that has no GitHub release yet,
# publishes one with the .meowtils file and the drag-in zip attached.
#
# To publish a new version: bump VERSION, add a "## <version>" section to CHANGELOG.md, push.
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build, self-test, package
        run: java buildtools/Build.java

      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Keep this build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundGen-${{ steps.v.outputs.version }}-${{ github.run_number }}
          path: |
            build/libs/*.meowtils
            build/*-dropin.zip

      - name: Publish a release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released. Bump VERSION (and CHANGELOG.md) to publish a new one."
            exit 0
          fi
          # Release notes = this version's section of CHANGELOG.md
          awk -v v="$VERSION" '$0 ~ "^## " {p = ($2 == v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "SoundGen $VERSION" > notes.md
          gh release create "$tag" \
            "build/libs/SoundGen-$VERSION.meowtils" \
            "build/SoundGen-$VERSION-dropin.zip" \
            --target "$GITHUB_SHA" \
            --title "SoundGen $VERSION" \
            --notes-file notes.md
